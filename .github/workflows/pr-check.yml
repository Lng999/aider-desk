name: PR Check

on:
  pull_request:

# Skip the onnxruntime-node GPU package download (embeddings run on CPU; onnxruntime-node
# 1.30+ fetches a ~270 MB CUDA EP from NuGet by default on linux/x64 and fails fatally if unreachable)
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint:check

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test
